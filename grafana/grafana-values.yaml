adminUser: admin
adminPassword: "admin"

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 1Gi
  storageClassName: local-path

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

datasources:
  datasources.yaml:
    apiVersion: 1

    datasources:

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.scloud-observability.svc.cluster.local:3100
        isDefault: false

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki

      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir.scloud-observability.svc:9009/prometheus
        isDefault: true

ingress:
  enabled: true

  ingressClassName: traefik

  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

  hosts:
    - observability.scloud.moe

  path: /
