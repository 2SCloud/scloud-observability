fullnameOverride: mimir-k3s
nameOverride: mimir

minio:
  enabled: false

kafka:
  enabled: false

mimir:
  structuredConfig:
    target: "all"   # monolithic — everything in one process
    multitenancy_enabled: false
    no_auth_tenant: anonymous

    ingest_storage:
      enabled: false

    ingester:
      push_grpc_method_enabled: true
      ring:
        replication_factor: 1

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    compactor:
      data_dir: /data/compactor

# Disable all microservice components
gateway:
  enabled: false

distributor:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

query_frontend:
  replicas: 0

query_scheduler:
  enabled: false

store_gateway:
  replicas: 0

compactor:
  replicas: 0

alertmanager:
  enabled: false
  zoneAwareReplication:
    enabled: false

ruler:
  enabled: false

overrides_exporter:
  enabled: false

# Single monolithic pod
mimir_monolithic:
  replicas: 1
  persistentVolume:
    enabled: true
    size: 6Gi
    storageClass: local-path
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

serviceAccount:
  create: true
